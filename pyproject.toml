[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kom"
version = "0.1.0"
description = "Raspagem recursiva de URL -> Markdown -> grafo hierárquico de conhecimento"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "markdownify>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kom = "kom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
